
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku | Brain Games</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5fb;
            color: #202944;
            display: flex;
            justify-content: center;
            padding: 35px 15px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            text-align: center;
        }

        .eyebrow {
            color: #5965ce;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        h1 { font-size: 38px; margin: 8px 0; }
        .subtitle { color: #778099; margin-bottom: 24px; }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 12px 35px #26345b12;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .lives {
            background: #fff0f0;
            color: #c43f52;
            border-radius: 20px;
            padding: 9px 13px;
            font-weight: 700;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            border: 2px solid #344265;
            width: 100%;
            aspect-ratio: 1;
        }

        .cell {
            min-width: 0;
            width: 100%;
            aspect-ratio: 1;
            border: 0;
            border-right: 1px solid #d7dcec;
            border-bottom: 1px solid #d7dcec;
            text-align: center;
            font-size: clamp(12px, 3.7vw, 21px);
            color: #5262d5;
            background: #fff;
            padding: 0;
            outline-offset: -3px;
        }

        .cell:focus { background: #e9edff; outline: 2px solid #5965ce; }
        .cell.fixed { color: #202944; background: #f0f2f8; font-weight: 800; }
        .cell:nth-child(3n) { border-right: 2px solid #344265; }
        .cell:nth-child(9n) { border-right: 0; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #344265;
        }

        .cell:disabled { opacity: 1; }
        .message {
            margin: 17px 0;
            padding: 12px;
            background: #f1f3ff;
            border-radius: 10px;
            color: #4554b4;
            font-size: 14px;
        }

        .message.error { background: #fff0f0; color: #b73749; }
        .message.success { background: #e9f9ef; color: #207747; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: left;
        }

        label { font-size: 12px; color: #69728b; }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 6px;
        }

        select { border: 1px solid #d9deec; background: white; }
        button { border: 0; cursor: pointer; font-weight: 700; }
        .primary { background: #5965ce; color: white; }
        .secondary { background: #edf0ff; color: #4554b4; }
        .hint { font-size: 12px; color: #8a91a5; margin-top: 18px; }

        @media (max-width: 420px) {
            .panel { padding: 12px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="eyebrow">BRAIN GAMES</div>
    <h1>Sudoku</h1>
    <p class="subtitle">A little focus goes a long way.</p>

    <div class="panel">
        <div class="status">
            <strong>Fill every empty cell</strong>
            <span class="lives">♥ {{ lives }} lives</span>
        </div>

        <div class="board">
            {% for r in range(9) %}
                {% for c in range(9) %}
                    <input
                        class="cell {% if initial[r][c] != 0 %}fixed{% endif %}"
                        value="{{ puzzle[r][c] if puzzle[r][c] != 0 else '' }}"
                        aria-label="Row {{ r+1 }}, column {{ c+1 }}"
                        readonly
                        {% if initial[r][c] != 0 or won %}disabled{% endif %}
                    >
                {% endfor %}
            {% endfor %}
        </div>

        <div class="message {{ message_type }}">{{ message }}</div>

        {% if not won %}
        <form method="post">
            <input type="hidden" name="action" value="move">
            <div class="controls">
                <div>
                    <label for="row">ROW</label>
                    <select id="row" name="row" required>
                        {% for i in range(1, 10) %}
                        <option value="{{ i }}">Row {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="col">COLUMN</label>
                    <select id="col" name="col" required>
                        {% for i in range(1, 10) %}
                        <option value="{{ i }}">Column {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="number">NUMBER</label>
                    <select id="number" name="number" required>
                        {% for i in range(1, 10) %}
                        <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button class="primary" type="submit" style="margin-top: 15px;">
                Submit Move
            </button>
        </form>
        {% endif %}

        <form method="post">
            <input type="hidden" name="action" value="new">
            <button class="secondary" type="submit">↻ New Game</button>
        </form>

        <p class="hint">Fill in the blanks · You have 3 lives · Good luck!</p>
    </div>
</div>
</body>
</html>
